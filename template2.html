  // First sign-in: name (pre-filled from Google) and city
  function finishSetup() {

  // What the sign-in redirect left in the address bar, in words a person understands
  function authErrorFromUrl() {
    const q = new URLSearchParams(location.search), h = new URLSearchParams(location.hash.replace(/^#/, ""));
    const get = (k) => q.get(k) || h.get(k) || "";
    const text = (get("error_description") + " " + get("error") + " " + get("error_code")).toLowerCase();
    if (/code.?verifier|flow.?state/.test(text)) return { kind: "link", msg: "Open the link in the same browser you asked for it from." };
    if (/expired|otp_expired|already used|invalid/.test(text) && /link|otp|token/.test(text)) return { kind: "link", msg: "That link has expired or was already used." };
    if (text.trim()) return { kind: "google", msg: "Sign-in didn't finish. Please try again." };
    return null;
  }
  // After a sign-in (on load or later): name from the account, then Finish setup or the plan
  let signingIn = false, loggedOut = false;
  async function afterSignIn(u) {
    if (signingIn || currentUser) return;   // the stored session can arrive from both startAuth and onChange
    signingIn = true; loggedOut = false;
    track("account");
    currentUser = u;
    if (u.offline) setNote(REACH_NOTE, 8000);
    // This device's plan already belongs to this account: show it now, catch up with the account in the background
    if (ls("mbp_owner") === u.id && hasPlan() && S.city) {
      S.name = S.name || ls("mbp_owner_name") || u.name || null;
      signingIn = false;
      if (S.name) { authMode = "home"; go(4); pullOnOpen(); return; }
      signingIn = true;
    }
    try { await pullOnOpen(); } finally { signingIn = false; }
    if (!S.name) S.name = (ls("mbp_owner") === u.id && ls("mbp_owner_name")) || u.name || null;
    if (!S.name || !S.city) { authMode = "setup"; S.step = -1; render(); return; }
    authMode = "home"; go(hasPlan() ? 4 : 0);
  }
  // Sync status note (bottom of the screen)
  let noteTimer = null;
  function setNote(msg, ms) {
    let el = document.getElementById("syncNote");
    if (!el) { el = document.createElement("div"); el.id = "syncNote"; el.className = "sync-note"; el.setAttribute("role", "status"); document.body.appendChild(el); }
    clearTimeout(noteTimer);
    el.textContent = msg; el.hidden = !msg;
    if (msg && ms) noteTimer = setTimeout(() => { if (el.textContent === msg) { el.textContent = ""; el.hidden = true;
      if (msg === REACH_NOTE && currentUser && ls("mbp_pending")) setNote(PENDING_NOTE); } }, ms);
  }
  const PENDING_NOTE = "Saved on this phone · will sync";
  const REACH_NOTE = "Couldn't reach your account. Using this phone's copy.";
  const keepLocal = () => ({ step: S.step, guest: S.guest, name: S.name });
  const ls = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} };
  // The last copy this device and the account agreed on (only valid for the account that owns this device's data)
  function readBase() {
    if (!currentUser || ls("mbp_owner") !== currentUser.id) return null;
    try { const b = JSON.parse(ls("mbp_base") || "null"); return b ? clean(b) : null; } catch (e) { return null; }
  }
  // Take the account's copy into this device
  function applyRemote(row) {
    const before = sig(S), k = keepLocal();
    const remote = clean(row.state);
    const srv = Date.parse(row.updated_at);
    const cap = (Number.isFinite(srv) ? srv : Date.now()) + 300000;   // a wrong clock can't make a copy "newer" for ever
    if (remote.updatedAt > cap) remote.updatedAt = cap;
    const base = readBase();
    S = Object.assign(base ? threeWay(base, S, remote) : mergeState(S, remote), k);
    if (!S.name && row.name) S.name = String(row.name).slice(0, 60);
    persist(); lastSig = sig(S);
    return sig(S) !== before;
  }
  // Read the account, merge, and upload only if this device has something new
  let lastPull = 0;
  async function syncNow() {
    if (!currentUser) return false;
    if (syncing) { syncAgain = true; return false; }
    syncing = true; clearTimeout(syncTimer); syncWaiting = false; lastPull = Date.now();
    let ok = false, changed = false;
    try {
      const who = currentUser;
      const row = await cloud.load();
      if (currentUser !== who) throw new Error("signed out");
      if (row) changed = applyRemote(row);
      const up = trimForUpload(S);
      const needUp = !row || sig(up) !== sig(clean(row.state)) || (row.name || null) !== (S.name || null)
        || (row.city || null) !== (S.city || null) || (row.area || "") !== (S.area || "");
      if (needUp) await cloud.save({ name: S.name || null, city: S.city || null, area: S.area || "", state: up });
      if (currentUser !== who) throw new Error("signed out");
      lsSet("mbp_pending", null); lsSet("mbp_owner", who.id); lsSet("mbp_owner_name", S.name || "");
      lsSet("mbp_base", JSON.stringify(up));
      const el = document.getElementById("syncNote"); if (el && el.textContent === PENDING_NOTE) setNote("");
      ok = true;
    } catch (e) {
      if (currentUser) { lsSet("mbp_pending", "1");
        // "Couldn't reach your account" says more; the pending note follows when it fades
        const el = document.getElementById("syncNote"); if (!(el && !el.hidden && el.textContent === REACH_NOTE)) setNote(PENDING_NOTE); }
    }
    syncing = false;
    if (changed && S.step === 4) render();
    if (syncAgain) { syncAgain = false; return syncNow(); }

  }
  // Two different plans on first sign-in: let the person pick
  function chooseCopy() {
    return new Promise((resolve) => {
      choosing = true; chrome();
      screen.innerHTML = `<section class="step">
        <h1>You have two plans</h1>
        <p class="q-sub">This phone has a plan, and your account has a different one. Which do you want to keep?</p>
        <button type="button" class="cta" id="keepPhone">Keep this phone's plan</button>
        <button type="button" class="ghost" id="useAccount">Use my account's plan</button>

      $("#keepPhone").addEventListener("click", () => { choosing = false; resolve("phone"); });
      $("#useAccount").addEventListener("click", () => { choosing = false; resolve("account"); });

  async function pullOnOpen() {
    const who = currentUser, owner = ls("mbp_owner");
    if (owner && owner !== currentUser.id) {
      // This device's data belongs to another account (it never logged out here): don't hand it to this one
      const k = { step: S.step, guest: false, name: null };
      S = Object.assign(fresh0(), k); persist(); lastSig = sig(S);
      ["mbp_base", "mbp_owner", "mbp_owner_name", "mbp_pending"].forEach(x => lsSet(x, null));
    }
    let row;
    try { row = await cloud.load(); }
    catch (e) { if (currentUser === who) setNote(REACH_NOTE, 8000); return; }
    if (currentUser !== who) return;   // logged out while loading: don't bring the plan back
    if (row) {
      const remote = clean(row.state), k = keepLocal();
      const remotePlan = !!(remote.diet && remote.kitchen !== null);
      if (remotePlan && hasPlan() && ls("mbp_owner") !== currentUser.id) {
        const pick = await chooseCopy();
        if (currentUser !== who) return;
        if (pick === "account") S = Object.assign(remote, k);
        S.updatedAt = Date.now() + (pick === "account" ? 0 : 1);
      } else if (remotePlan && !hasPlan()) {
        S = Object.assign(remote, k);
      }
      if (!S.name && row.name) S.name = String(row.name).slice(0, 60);
      if (!S.city && CITY_LIST.includes(row.city)) S.city = row.city;
      if (!S.area && typeof row.area === "string") S.area = row.area.slice(0, 80);
      persist(); lastSig = sig(S);
    }
    if (!S.name) S.name = (ls("mbp_owner") === currentUser.id && ls("mbp_owner_name")) || currentUser.name || null;
    lsSet("mbp_owner", currentUser.id);
    await syncNow();
  }
  // Coming back to the app (tab shown, window focused, network back): catch up with other devices
  const retry = () => {
    if (!currentUser || syncing) return;
    if (ls("mbp_pending") === "1" || Date.now() - lastPull > 3000) syncNow();
  };
  window.addEventListener("online", retry);
  window.addEventListener("focus", retry);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") retry();
    else if (currentUser && syncWaiting) syncNow();   // app hidden or closing: don't hold a change back
  });
  window.addEventListener("pagehide", () => { if (currentUser && syncWaiting) syncNow(); });
  // Another tab on this device changed the plan, or logged out
  window.addEventListener("storage", (e) => {
    if (e.key !== "mbp") return;
    if (e.newValue === null) {
      if (currentUser || S.step >= 0) { clearTimeout(syncTimer); currentUser = null; loggedOut = true; S = fresh0(); lastSig = null; authMode = "home"; setNote(""); render(); }
      return;
    }
    try { S = Object.assign(clean(JSON.parse(e.newValue)), keepLocal()); lastSig = sig(S); if (S.step === 4) render(); } catch (err) {}
  });

  async function startAuth() {
    const urlErr = authErrorFromUrl();
    const hadCode = new URLSearchParams(location.search).has("code");
    let u = null;
    try { u = await Promise.race([cloud.session(), new Promise(r => setTimeout(() => r(null), 4000))]); } catch (e) { u = null; }
    // Logged out on this device and not coming back from a sign-in: a session that reappeared is a leftover
    if (u && ls("mbp_loggedout") && !hadCode) { loggedOut = true; await cloud.signOut(); u = null; }
    if (location.search || location.hash) { try { history.replaceState(null, "", location.pathname); } catch (e) {} }
    if (u) return afterSignIn(u);
    const verifierWaiting = (() => { try { return Object.keys(localStorage).some(k => k.endsWith("-code-verifier")); } catch (e) { return false; } })();
    if (urlErr) { authMode = "error"; authErrKind = urlErr.kind; authMsg = urlErr.msg; }
    else if (hadCode && verifierWaiting) {
      authMode = "waiting";   // the sign-in is still finishing; onChange takes over when it does
      setTimeout(() => {
        if (authMode === "waiting" && !currentUser) { authMode = "error"; authErrKind = "google"; authMsg = "Couldn't finish signing in. Check your connection and try again."; render(); }
      }, 15000);
    }
    else if (hadCode) { authMode = "error"; authErrKind = "link"; authMsg = "Open the link in the same browser you asked for it from."; }
    render();
  }

  // 1. Diet

  const storeName = (f) => f.store === "Brand store" && f.where ? f.where.split(",")[0].trim() : f.store;
  // Which meal(s) a food belongs to, as [meal, share of the day's amount]
  // Which meals a food suits, best first.
  const MEALS = ["Breakfast", "Lunch", "Snacks", "Dinner"];
  function mealsFor(f) {
    const c = f.cat;
    if (c === "Soya & dal" && /sattu/i.test(f.name)) return ["Breakfast", "Lunch", "Snacks"];
    if (["Grains & atta", "Soya & dal", "Pasta & noodles", "Chicken", "Fish & seafood", "Mutton", "Paneer & tofu", "Curd", "Ready non-veg"].includes(c)) return ["Lunch", "Dinner"];
    if (c === "Oats & muesli") return ["Breakfast", "Snacks"];
    if (c === "Bread") return ["Breakfast", "Lunch", "Dinner", "Snacks"];
    if (c === "Spreads") return ["Breakfast", "Snacks", "Dinner", "Lunch"];
    if (c === "Eggs") return ["Breakfast", "Dinner", "Lunch"];
    if (c === "Milk") return ["Breakfast", "Dinner", "Snacks"];
    if (c === "Cheese") return ["Breakfast", "Lunch", "Dinner"];
    if (c === "Yogurt") return ["Snacks", "Lunch", "Breakfast", "Dinner"];

  }
  // Spread the day's foods over four meals so each gets a fair share of the calories
  // (breakfast 25%, lunch 30%, snacks 15%, dinner 30%). Mess meals fill lunch and dinner first.
  // Big amounts of a food are split between two meals; foods sold in pieces split in whole pieces.
  // Mess / home meals: 1 = lunch, 2 = lunch + dinner, 3 = breakfast + lunch + dinner
  const messIn = (meal) => ({ Breakfast: S.meals >= 3 ? 1 : 0, Lunch: S.meals >= 1 ? 1 : 0, Dinner: S.meals >= 2 ? 1 : 0 }[meal] || 0);
  function planMeals(items) {
    const rows = { Breakfast: [], Lunch: [], Snacks: [], Dinner: [] };
    const kcalOf = (it) => it.grams * it.food.kcal;
    const total = items.reduce((s, it) => s + kcalOf(it), 0) + S.meals * MESS.kcal;
    const left = { Breakfast: 0.25 * total - messIn("Breakfast") * MESS.kcal, Lunch: 0.30 * total - messIn("Lunch") * MESS.kcal, Snacks: 0.15 * total, Dinner: 0.30 * total - messIn("Dinner") * MESS.kcal };
    const put = (meal, it, share) => { rows[meal].push({ it, share }); left[meal] -= kcalOf(it) * share; };
    // split an item between two meals; returns the share for the first one
    const splitShare = (it) => {
      const u = it.food.unit;
      if (u) { const n = Math.round(it.grams / u.g); if (n < 2) return 1; return Math.ceil(n / 2) / n; }
      return 0.5;
    };
    // foods that fit fewer meals are placed first, so flexible ones can fill the gaps
    const todo = [...items].sort((a, b) => mealsFor(a.food).length - mealsFor(b.food).length || kcalOf(b) - kcalOf(a));
    for (const it of todo) {
      const ok = mealsFor(it.food), k = kcalOf(it);
      // main dishes go half to lunch, half to dinner (unless a mess meal already covers that meal)
      if (ok[0] === "Lunch" && ok[1] === "Dinner") {
        const lunchFull = left.Lunch <= 0, dinFull = left.Dinner <= 0;
        if (lunchFull !== dinFull || k < 200 || it.grams < 40) { put(left.Lunch >= left.Dinner ? "Lunch" : "Dinner", it, 1); continue; }
        const a = splitShare(it); put("Lunch", it, a); if (a < 1) put("Dinner", it, 1 - a); continue;
      }
      // otherwise: the allowed meal with the most room (earlier = preferred on ties)
      const byRoom = ok.map((m, i) => ({ m, room: left[m] - i * 40 })).sort((x, y) => y.room - x.room);
      const best = byRoom[0], second = byRoom[1];
      if (second && k > 250 && (k > 350 || k > Math.max(best.room, 0) * 1.25)) {
        const a = splitShare(it);
        if (a < 1) { put(best.m, it, a); put(second.m, it, 1 - a); continue; }
      }
      put(best.m, it, 1);
    }
    // Peanut butter and other spreads go in the meal that has the bread
    const breadMeals = MEALS.filter(m => rows[m].some(r => r.it.food.cat === "Bread"));
    if (breadMeals.length) for (const m of MEALS) {
      if (breadMeals.includes(m)) continue;
      const moving = rows[m].filter(r => r.it.food.cat === "Spreads");
      if (!moving.length) continue;
      rows[m] = rows[m].filter(r => r.it.food.cat !== "Spreads");
      for (const r of moving) {

      }
    }
    for (const m of MEALS) rows[m].sort((x, y) => y.it.grams * y.share * y.it.food.p - x.it.grams * x.share * x.it.food.p);
    return rows;
  }

        <summary>About prices and data</summary>
        <p>Anything marked “≈” or “est.” is an estimate. Tap or hover the “est.” tag to see why.</p>

        <p>Suggested targets use the Mifflin-St Jeor formula for calories you burn at rest, times your activity level, then 20% less to lose fat or 10% more to build muscle. Protein is 1.8–2.0 g per kg when building or cutting (within the 1.4–2.0 g/kg the International Society of Sports Nutrition suggests for active people, a little higher when cutting) and 1.0–1.6 g/kg to maintain; above a BMI of 25 it's counted on a healthy weight for your height. Fat is 25% of calories, carbs the rest. They're estimates for healthy adults, not medical advice; set your own anytime. Hostel plans, and PG plans without a kitchen, only use food you can make with what's in your room: eggs need a kettle or microwave, heat-and-eat packs a microwave, and chilled food a fridge unless it's a single cup or bottle you finish that day. A mess meal counts as about 15 g protein, 650 kcal, 95 g carbs and 22 g fat. Carbs and fat targets allow ±10%. Eggs count as 50 g each.</p>

      const u = $("#undo"); if (u) u.addEventListener("click", () => { S.exclude = []; save(); result(); });
    };
    const drawShop = () => {
      if (!isPro()) { panel.innerHTML = proCard("shop"); wirePro(panel, drawShop); return; }
      const n = S.people || 1;
      const today = localDay();
      const daysAgo = (d) => Math.round((Date.parse(today) - Date.parse(d)) / 864e5);
      const week = W.week.map(w => {
        const grams = w.grams * n, packs = Math.max(1, Math.ceil(grams / w.food.packQty - 1e-6));
        const perDay = grams / 7, fresh = needs(w.food).includes("fridge") || w.food.cat === "Bread";
        return { food: w.food, packs, packPrice: w.packPrice, cost: packs * w.packPrice, eaten: w.eatenCost * n,
          lasts: packs * w.food.packQty / perDay, firstLasts: w.food.packQty / perDay, fresh };
      });
      const total = week.reduce((s, w) => s + w.cost, 0);
      const eatenCost = week.reduce((s, w) => s + w.eaten, 0);
      const weekBudget = 7 * S.budget * n;
      const left = Math.max(0, total - eatenCost);
      const line = (w) => {
        const f = w.food, mp = myPrice(f), sub = [];
        sub.push(`${w.packs} × ${esc(f.pack)} · ${esc(storeName(f))}`);
        // Fresh food: buy one pack at a time so it doesn't go off
        if (w.fresh && w.packs > 1) sub.push(`buy 1 now, the next around day ${Math.max(2, Math.floor(w.firstLasts) + 1)}`);
        else if (w.lasts > 9) sub.push(`lasts about ${w.lasts > 60 ? "2 months+" : Math.round(w.lasts) + " days"}`);
        if (S.kitchen === false && !(S.gear || {}).fridge && needs(f).includes("fridge")) sub.push(`<b class="fresh">buy on the day you eat it</b>`);
        const stale = mp && daysAgo(mp.d) > 30;
        const editing = priceEdit === f.id;
        return `<li tabindex="0" role="checkbox" aria-checked="false" data-sid="${f.id}">
          <span class="box"></span>
          <span class="sn">${esc(f.name)}<small>${sub.join(" · ")}</small>
            ${mp ? `<small class="mine">Your price ₹${fmt(mp.p)} a pack${stale ? ` · from ${daysAgo(mp.d)} days ago, still right?` : ""}</small>` : ""}</span>
          <button type="button" class="sp" data-edit="${f.id}" aria-label="Change the price of ${esc(f.name)}">${priceEst(f) ? "≈" : ""}₹${fmt(w.cost)}<i>${mp ? "your price" : priceEst(f) ? "est. · edit" : "edit"}</i></button></li>
          ${editing ? priceEditor(f) : ""}`;
      };
      panel.innerHTML = `<div class="people"><span>Buying for</span>
          <div class="pills small">${[1, 2, 3, 4].map(k => `<button type="button" class="pill" data-people="${k}" aria-pressed="${n === k}">${k === 1 ? "Just me" : k}</button>`).join("")}</div>${n > 1 ? "<span>people</span>" : ""}</div>
        ${n > 1 ? `<p class="hint-sm">Everyone eats the same plan. Bigger packs make it cheaper per person.</p>` : ""}
        <p class="hint-sm">Tap a price to use what Blinkit or Zepto shows you today.</p>
        <ul class="shop">${week.map(line).join("")}</ul>
        <div class="total"><span>First week's shop${n > 1 ? ` · ₹${fmt(total / n)} each` : ""}</span><b>₹${fmt(total)}</b></div>
        <div class="split"><span>Eaten this week</span><b>₹${fmt(eatenCost)}</b><span>Left in your cupboard for next week</span><b>₹${fmt(left)}</b></div>
        ${total > weekBudget + 1 ? `<div class="note week-note">
          <b>This first shop is more than your weekly budget of ₹${fmt(weekBudget)}</b> (7 × ₹${S.budget}${n > 1 ? ` × ${n} people` : ""}). Packs come in fixed sizes, so ₹${fmt(left)} of it is food that lasts into next week. Next week's shop will be smaller.</div>` : ""}
        <button type="button" class="ghost" id="copy">Copy list</button>`;
      panel.querySelectorAll("[data-people]").forEach(b => b.addEventListener("click", () => { S.people = +b.dataset.people; save(); drawShop(); }));
      panel.querySelectorAll(".shop li[data-sid]").forEach(li => {
        const flip = () => { li.classList.toggle("done"); li.setAttribute("aria-checked", li.classList.contains("done")); };
        li.addEventListener("click", (e) => { if (!e.target.closest(".sp")) flip(); });
        li.addEventListener("keydown", e => { if (e.target === li && (e.key === " " || e.key === "Enter")) { e.preventDefault(); flip(); } });
      });
      wirePriceEdit(drawShop);
      $("#copy").addEventListener("click", (e) => {
        const text = (n > 1 ? `Weekly shop for ${n} people\n` : "") + week.map(w => `${w.food.name} (${w.food.pack}) x${w.packs} - ₹${fmt(w.cost)}`).join("\n") + `\nTotal: ₹${fmt(total)}`;
        const btn = e.currentTarget;
        const done = (m) => { btn.textContent = m; setTimeout(() => btn.textContent = "Copy list", 2000); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => done("Copied"), () => done("Couldn't copy here"));
        else done("Couldn't copy here");
      });
    };
    const srcSwitch = () => `<div class="src" role="radiogroup" aria-label="Source">
        <button type="button" data-src="rest" aria-pressed="${outSrc === "rest"}">Restaurants${isPro() ? "" : ` <span class="pro-badge">Pro</span>`}</button>
        <button type="button" data-src="lic" aria-pressed="${outSrc === "lic"}">Non-veg readymade</button></div>`;
    const wireSrc = () => panel.querySelectorAll("[data-src]").forEach(b => b.addEventListener("click", () => { outSrc = b.dataset.src; outShow = 15; drawOut(); }));
    const drawLicious = () => {
      const list = FOODS.filter(f => f.cat === "Ready non-veg").sort((a, b) => a.price / a.packQty / a.p - b.price / b.packQty / b.p);
      const picked = new Map((S.rte || []).map(x => [x.link, x.g]));
      const blocked = S.diet !== "nonveg";
      panel.innerHTML = srcSwitch() + `<p class="out-lede">Heat-and-eat and ready-to-eat chicken from Licious. No stove needed: heat-and-eat packs need a microwave, and all of them need a fridge unless you finish the pack the day you buy it. Add one and the rest of your day is planned around it.</p>
        ${blocked ? `<div class="note">These are chicken products. Choose “Everything” in your answers to use them.</div>` : ""}
        <ul class="foods">${list.map(f => `<li>
          <div class="qty">${fmt(f.p * f.packQty)}<small>g protein / pack</small></div>
          <div class="fname"><div class="n">${esc(f.name)}</div>
            <div class="m">${S.city !== "Delhi NCR" ? "≈" : ""}₹${fmt(f.price)}${S.city !== "Delhi NCR" ? " " + estTag("Licious price in Greater Noida on 18 Oct. Yours may differ.") : ""} for ${esc(f.pack)} · ${esc(f.prep || "")} · ${fmt(f.kcal * f.packQty)} kcal</div>
            ${S.kitchen === false && needs(f).includes("microwave") && !(S.gear || {}).microwave ? `<div class="how warn">Needs a microwave</div>` : ""}
            ${picked.has(f.link) ? `<div class="grams">${[0.5, 1].map(k => `<button type="button" class="pill" data-g="${Math.round(f.packQty * k)}" data-glink="${esc(f.link)}" aria-pressed="${picked.get(f.link) === Math.round(f.packQty * k)}">${k === 1 ? "1 pack a day" : "½ pack a day"}</button>`).join("")}</div>`
              : ""}
            <div class="store-name">Licious</div></div>
          <button type="button" class="swap add${picked.has(f.link) ? " on" : ""}" data-lic="${esc(f.link)}" ${blocked ? "disabled" : ""}>${picked.has(f.link) ? "Added" : "Add"}</button></li>`).join("")}</ul>
        <p class="foot" style="margin-top:12px">Macros are read from the nutrition label on each Licious pack. Prices are Licious prices in Greater Noida on 18 Oct 2026.</p>`;
      wireSrc();
      panel.querySelectorAll("[data-lic]").forEach(b => b.addEventListener("click", () => {
        const link = b.dataset.lic, f = byLink.get(link);
        S.rte = S.rte || [];
        const i = S.rte.findIndex(x => x.link === link);
        if (i >= 0) S.rte.splice(i, 1); else S.rte.push({ link, g: f.packQty });
        S.exclude = S.exclude.filter(x => x !== f.id);
        save(); result();
      }));
      panel.querySelectorAll("[data-g]").forEach(b => b.addEventListener("click", () => {
        const x = (S.rte || []).find(x => x.link === b.dataset.glink); if (x) { x.g = +b.dataset.g; save(); result(); }
      }));
    };
    const drawOut = () => {
      if (outSrc === "lic") return drawLicious();
      if (!isPro()) { panel.innerHTML = srcSwitch() + proCard("eatout"); wireSrc(); wirePro(panel, drawOut); return; }
      const allow = { veg: ["veg"], egg: ["veg", "egg"], nonveg: ["veg", "egg", "nonveg"] }[S.diet || "nonveg"];
      const chains = ["All", ...new Set(REST.map(r => r.chain))];
      const reg = mcdRegion();
      const pv = (r) => (priceOf(r) || {}).v || 0;
      const list = REST.filter(r => allow.includes(r.diet) && (!r.region || r.region === reg) && !(r.notIn || []).includes(S.city) && (outChain === "All" || r.chain === outChain) && (!outPriced || r.prices))
        .sort((a, b) => outSort === "ratio" ? b.p / b.kcal - a.p / a.kcal
          : outSort === "rupee" ? (pv(b) ? b.p / pv(b) : 0) - (pv(a) ? a.p / pv(a) : 0) : b.p - a.p);
      const added = new Set((S.out || []).map(o => o.key));
      panel.innerHTML = srcSwitch() + `<p class="out-lede">Ordering in today? Add it here and the rest of your day is planned around it.</p>
        <div class="pills small">${chains.map(c => `<button type="button" class="pill" data-chain="${esc(c)}" aria-pressed="${c === outChain}">${esc(c)}</button>`).join("")}</div>
        <div class="sortrow"><span>Sort by</span>
          <button type="button" class="link${outSort === "ratio" ? " on" : ""}" data-sort="ratio">Protein per calorie</button>
          <button type="button" class="link${outSort === "rupee" ? " on" : ""}" data-sort="rupee">Protein per ₹</button>
          <button type="button" class="link${outSort === "p" ? " on" : ""}" data-sort="p">Most protein</button></div>
        <label class="check-sm"><input type="checkbox" id="onlyPriced" ${outPriced ? "checked" : ""}> Only items with a price</label>
        <ul class="foods">${list.slice(0, outShow).map(r => `<li>
          <div class="qty">${fmt(r.p)}<small>g protein</small></div>
          <div class="fname"><div class="n">${esc(r.name)}</div>
            <div class="m">${(() => { const q = priceOf(r); return !q ? `<b class="rp">price n/a</b>` : q.exact ? `<b class="rp">₹${fmt(q.v)}</b>` : `<b class="rp" title="${esc(q.from)} price">≈₹${fmt(q.v)}</b> ${estTag(q.from + " price. We didn't find this item in your city.")}`; })()}${r.chain === "Pizza Hut" && /\((Personal|Medium|Large)\)/.test(r.name) ? " " + estTag("Pizza Hut price for this size, taken as pan crust. Other crusts cost a bit more.") : ""} · ${esc(r.chain)} · ${fmt(r.kcal)} kcal${r.est ? " " + estTag(r.est) : r.chain === "Burger King" ? " " + estTag("Burger King India's latest nutrition data is from 2020. The recipe may have changed.") : ""} · ${r.c == null ? "carbs not published" : fmt(r.c) + "g carbs"} · ${r.f == null ? "" : fmt(r.f) + "g fat"}</div>
            ${slicesOf(r) ? `<div class="m">${slicesOf(r)} slices · ${fmt(r.p / slicesOf(r))} g protein and ${fmt(r.kcal / slicesOf(r))} kcal a slice</div>` : ""}
            ${CHAIN_SITE[r.chain] ? `<a class="find" href="${CHAIN_SITE[r.chain]}" target="_blank" rel="noopener">Order from ${esc(r.chain)}</a>` : ""}</div>
          <button type="button" class="swap add${added.has(restKey(r)) ? " on" : ""}" data-add="${r.id}">${added.has(restKey(r)) ? "Added" : "Add"}</button></li>`).join("")}</ul>
        ${list.length ? "" : `<p class="hint-sm">Nothing here. Untick “Only items with a price” to see items without prices. You can add your own price to any item.</p>`}
        ${list.length > outShow ? `<button type="button" class="ghost" id="more">Show more (${list.length - outShow})</button>` : ""}`;
      wireSrc();
      panel.querySelectorAll("[data-chain]").forEach(b => b.addEventListener("click", () => { outChain = b.dataset.chain; outShow = 15; drawOut(); }));
      panel.querySelectorAll("[data-sort]").forEach(b => b.addEventListener("click", () => { outSort = b.dataset.sort; drawOut(); }));
      const m = $("#more"); if (m) m.addEventListener("click", () => { outShow += 15; drawOut(); });
      const op = $("#onlyPriced"); if (op) op.addEventListener("change", () => { outPriced = op.checked; outShow = 15; drawOut(); });
      panel.querySelectorAll("[data-add]").forEach(b => b.addEventListener("click", () => {
        const r = REST[+b.dataset.add], key = restKey(r);
        S.out = (S.out || []).filter(o => o.key);   // drop orders saved by an older version
        const i = S.out.findIndex(o => o.key === key);
        if (i >= 0) S.out.splice(i, 1); else S.out.push({ key, price: (priceOf(r) || {}).v || null });
        save(); result();
      }));
    };
    const draw = () => ({ day: drawDay, shop: drawShop, out: drawOut }[tab])();
    draw();

    screen.querySelectorAll("[role=tab]").forEach(b => b.addEventListener("click", () => {
      tab = b.dataset.tab;
      screen.querySelectorAll("[role=tab]").forEach(x => x.setAttribute("aria-selected", x === b));
      draw();
    }));
    const r = $("#tBudget"); setFill(r);
    let tm;
    r.addEventListener("input", () => {
      setFill(r); $("#tb").textContent = "₹" + r.value;
      clearTimeout(tm); tm = setTimeout(() => { S.budget = +r.value; save(); result(); $("#tBudget").focus(); }, 250);
    });
    let rt;
    wireSteppers($("#tgts"), () => { clearTimeout(rt); rt = setTimeout(result, 350); });
    const ma = $("#macAuto"); if (ma) ma.addEventListener("click", () => { S.myC = null; S.myF = null; save(); result(); });
    wireGear(screen, () => result());
    $("#bkOpen").addEventListener("click", () => {
      const box = $("#bkBox"); box.hidden = !box.hidden;
      // Plan and settings only: name and email stay out of the code, since people paste these into chats
      const s2 = Object.assign({}, S, { name: null, guest: false });
      $("#bkCode").value = btoa(unescape(encodeURIComponent(JSON.stringify({ v: 2, s: s2 }))));
    });
    $("#bkCopy").addEventListener("click", (e) => {
      const btn = e.currentTarget, code = $("#bkCode");
      const done = (m) => { btn.textContent = m; setTimeout(() => btn.textContent = "Copy code", 2000); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code.value).then(() => done("Copied"), () => { code.select(); done("Selected: copy it"); });
      else { code.select(); done("Selected: copy it"); }
    });
    $("#bkRestore").addEventListener("click", () => {
      try {
        const d = JSON.parse(decodeURIComponent(escape(atob($("#bkIn").value.trim()))));
        if (!d || !d.s) throw 0;
        const keep = { name: S.name, guest: S.guest };
        S = Object.assign(clean(d.s), keep); S.step = 4;
        save(); result();
      } catch (e) { $("#bkErr").textContent = "That code didn't work. Copy the whole code and try again."; }
    });
    const fsb = $("#fixStyleBudget"); if (fsb) fsb.addEventListener("click", () => { S.budget = +fsb.dataset.v; save(); result(); });
    const kb = $("#keepBudget"); if (kb) kb.addEventListener("click", () => { S.style = "cheap"; S.exclude = []; save(); result(); });
    const fb = $("#fixBudget"); if (fb) fb.addEventListener("click", () => { S.budget = +fb.dataset.v; save(); result(); });
    const fp = $("#fixProtein"); if (fp) fp.addEventListener("click", () => { S.myP = +fp.dataset.v; save(); result(); });
    const fk = $("#fixKcal"); if (fk) fk.addEventListener("click", () => { S.myK = Math.min(5000, Math.max(1000, +fk.dataset.v)); save(); result(); });
    const ur = $("#useRec2"); if (ur) ur.addEventListener("click", () => { S.myP = null; S.myK = null; S.myC = null; S.myF = null; save(); result(); });
    $("#restart").addEventListener("click", () => go(0));
    screen.querySelectorAll("[data-style]").forEach(b => b.addEventListener("click", () => { S.style = b.dataset.style; S.exclude = []; save(); result(); }));
    const lc = $("#locChange"); if (lc) lc.addEventListener("click", () => { $("#locEdit").hidden = false; lc.hidden = true; });
    const ls = $("#locSave"); if (ls) ls.addEventListener("click", () => {
      S.city = $("#lCity").value || null; S.area = $("#lArea").value.trim(); save();
      result();
    });
    const lo = $("#logout"); if (lo) lo.addEventListener("click", () => {
      // Shared hostel phones: logging out removes the plan, prices and account from this device
      if (!confirm("Log out and remove your plan and saved prices from this device? Copy your backup code first if you want them back.")) return;
      clearDevice();
      cloud.signOut();
    });
    const da = $("#deleteAcct"); if (da) da.addEventListener("click", confirmDelete);
  }

  // Removes everything this app keeps on the device and returns to the welcome screen
  function clearDevice() {
    clearTimeout(syncTimer); syncWaiting = false; currentUser = null; loggedOut = true;
    try { ["mbp", "mbp_user", "mbp_owner", "mbp_owner_name", "mbp_pending", "mbp_base"].forEach(k => localStorage.removeItem(k)); } catch (e) {}
    // Remember the logout: if a slow token refresh writes the session back, the next start signs it out again
    lsSet("mbp_loggedout", "1");
    S = fresh0(); lastSig = null; authMode = "home"; setNote("");
    render(); window.scrollTo(0, 0);   // not go(): that would save the empty plan straight back
  }
  function confirmDelete() {
    screen.innerHTML = `<section class="step">
      <h1>Delete your account?</h1>
      <p class="q-sub">This permanently deletes your account and your saved plan. This can't be undone.</p>
      <p class="err" id="delErr" role="alert"></p>
      <button type="button" class="cta" id="confirmDelete">Delete my account</button>
      <button type="button" class="ghost" id="cancelDelete">Cancel</button>
    </section>`;
    window.scrollTo(0, 0);
    $("#cancelDelete").addEventListener("click", () => result());
    $("#confirmDelete").addEventListener("click", async (e) => {
      const btn = e.currentTarget; btn.disabled = true; btn.textContent = "Deleting…";
      try { await cloud.deleteAccount(); }
      catch (err) { $("#delErr").textContent = "Couldn't delete your account. Check your internet and try again."; btn.disabled = false; btn.textContent = "Delete my account"; return; }
      clearDevice();
    });
  }

  function qty(it) {
    const f = it.food;
    if (f.unit) {
      const n = it.grams / f.unit.g;
      // under one: nearest quarter, never shown as 0
      if (n < 0.875) { const q = Math.max(1, Math.round(n * 4)); return `${["", "¼", "½", "¾"][q]}<small>${f.unit.name}</small>`; }
      const shown = n >= 3 ? Math.round(n) : Math.round(n * 2) / 2;
      const word = f.unit.name + (shown > 1 ? "s" : "");
      const txt = shown === 0.5 ? "½" : shown % 1 ? fmt(shown, 1) : fmt(shown);
      return `${txt}<small>${word}</small>`;
    }
    const g = it.grams < 20 ? Math.round(it.grams) : Math.round(it.grams / 5) * 5;
    return `${fmt(g)}<small>${f.unitLabel}</small>`;
  }

  // Older saves only had kitchen yes/no
  if (!S.place && S.kitchen !== null && S.kitchen !== undefined) S.place = S.kitchen ? "home" : "hostel";
  // Every visit starts on the welcome / log-in screen. Saved answers are kept, so logging in
  // (or "Try it without an account") goes straight back to the plan.
  S.step = -1; S.name = null; S.guest = false;
  // The old "account" was only an email typed on this device; real sign-in replaces it (the plan is kept)
  try { localStorage.removeItem("mbp_user"); } catch (e) {}
  cloud.onChange((u) => {
    if (u && !currentUser && !signingIn && !loggedOut && S.step < 0) afterSignIn(u);
    else if (u && currentUser) retry();   // e.g. token refreshed once the network is back
  });
  const boot = () => { track("open"); if (cloud.enabled) startAuth(); else render(); };
  if (document.readyState === "complete") boot(); else window.addEventListener("load", boot);
})();
</script>
</body>
</html>
