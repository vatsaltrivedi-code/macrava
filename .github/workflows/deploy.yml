# Builds the app and publishes it to Cloudflare Pages (project "macro-budget") on every push to main.
# Needs two repository secrets: CLOUDFLARE_APITOKEN (Pages: Edit only) and CLOUDFLARE_ACCOUNT_ID.
name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          cp config.public.json config.json
          python3 build_local.py
          mkdir -p site
          cp macro-budget-planner.html site/index.html
          cp dist/privacy.html dist/terms.html site/
          cp public/robots.txt public/sitemap.xml public/manifest.webmanifest public/sw.js public/icon.svg site/
          grep -q "sb_publishable_" site/index.html
      - name: Link preview image
        continue-on-error: true
        run: |
          npm i --prefix /tmp/og --no-save --silent playwright-core@1.56.0
          NODE_PATH=/tmp/og/node_modules node public/og-shot.js
          ls -l site/og.png
      - name: Publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_APITOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=macro-budget --branch=main --commit-dirty=true
