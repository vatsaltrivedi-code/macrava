/* The app moved to macrava.pages.dev. A guest's saved plan lives in this browser under the old address,
   so it travels along in the part of the link after "#" (never sent to any server) and the new site keeps it.
   Signed-in people just sign in again there; their plan comes back from their account. */
(function () {
  var to = "https://macrava.pages.dev" + location.pathname + location.search, d = {}, n = 0;
  try {
    var signedIn = localStorage.getItem("mbp_owner") || Object.keys(localStorage).some(function (k) { return k.indexOf("sb-") === 0; });
    if (!signedIn && location.pathname === "/") ["mbp", "theme", "mbp_device", "mbp_seen", "mbp_pro"].forEach(function (k) {
      var v = localStorage.getItem(k); if (v) { d[k] = v; n++; }
    });
  } catch (e) {}
  if (n) to += "#move=" + encodeURIComponent(JSON.stringify(d));
  location.replace(to);
})();
</script>
